name: VoidTerm CI & APK Builder

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-rust:
    name: Rust IPC Broker & Guest Daemon Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Musl Target & Cross Toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu
          rustup target add aarch64-unknown-linux-musl aarch64-linux-android

      - name: Cargo Check & Test (Host)
        run: |
          cd hybrid-term-broker
          cargo check
          cargo test --lib

      - name: Build Static Guest Daemon (musl for Debian microVM)
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
        run: |
          cd hybrid-term-broker
          cargo build --target aarch64-unknown-linux-musl --bin guest_daemon --release

      - name: Build Host Daemon Binary
        run: |
          cd hybrid-term-broker
          cargo build --bin hybrid-term-broker --release

      - name: Upload Rust Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: voidterm-rust-binaries
          path: |
            **/target/**/hybrid-term-broker
            **/target/**/guest_daemon
          if-no-files-found: warn

  build-android:
    name: Android APK Build
    runs-on: ubuntu-latest
    needs: build-rust
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Rust Artifacts
        uses: actions/download-artifact@v4
        with:
          name: voidterm-rust-binaries
          path: rust-artifacts

      - name: Stage Static Guest Daemon to Assets
        run: |
          mkdir -p android/app/src/main/assets/
          find rust-artifacts -name "guest_daemon" -exec cp {} android/app/src/main/assets/guest_daemon \;
          chmod +x android/app/src/main/assets/guest_daemon || true
          ls -lh android/app/src/main/assets/

      - name: Fetch Official Debian Minimal Rootfs (.tar.gz)
        run: |
          echo "Downloading Debian Bookworm ARM64 rootfs..."
          curl -fL -o android/app/src/main/assets/debian-rootfs.tar.gz \
            https://raw.githubusercontent.com/debuerreotype/docker-debian-artifacts/dist-arm64v8/bookworm/slim/oci/blobs/rootfs.tar.gz
          echo "Rootfs fetched successfully: $(ls -lh android/app/src/main/assets/debian-rootfs.tar.gz)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Assemble Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoidTerm-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
